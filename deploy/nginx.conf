server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ATTENZIONE alla trappola di nginx: un `add_header` dentro un
    # `location` AZZERA quelli ereditati dal blocco `server`. La prima
    # versione metteva Cache-Control nei location e le intestazioni di
    # sicurezza nel server: risultato, nessun CSP servito.
    # Qui il caching si fa con `expires`, che non rompe l'ereditarieta',
    # e gli add_header stanno tutti a livello server.
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
    # Gli asset portano il DIGEST DEL CONTENUTO nel nome
    # (style.c109b08f.css), quindi un URL identifica un contenuto e
    # basta: si possono tenere per sempre. Contenuto diverso = nome
    # diverso = URL diverso, e nessuna cache puo' servire lo stantio.
    location /assets/ {
        # NIENTE `always` su questo header, ed e' la parte che conta.
        # Con `always` nginx lo mette anche sulle risposte di ERRORE: un
        # 404 su un asset usciva con max-age un anno + immutable, quindi
        # browser e CDN potevano tenersi il fallimento per un anno.
        #
        # E' precisamente il caso del rollout: la richiesta che finisce
        # su un pod vecchio prende 404, e con quell'header il 404 diventa
        # PERMANENTE invece di risolversi al ricarico. Peggio del CSS
        # stantio che il digest doveva eliminare.
        #
        # Senza `always`, l'header vale solo su 200/204/301/302/303/304/
        # 307/308 — cioe' quando c'e' davvero un contenuto immutabile da
        # descrivere.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/intestazioni-sicurezza.conf;
    }

    # Nessun form, nessuna API, nessuna risorsa esterna: il corso e'
    # autonomo e funziona offline. La CSP lo dichiara invece di
    # lasciarlo implicito. 'unsafe-inline' serve al solo snippet
    # anti-lampeggio del tema, che sta in <head> per necessita'.
    include /etc/nginx/intestazioni-sicurezza.conf;

    # Gli errori non si mettono in cache, mai: un 404 e' uno stato del
    # momento, non un contenuto. Senza questo, una CDN puo' applicare la
    # propria euristica e conservarlo comunque.
    error_page 404 = @nontrovato;
    location @nontrovato {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/intestazioni-sicurezza.conf;
        return 404;
    }

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 1024;
}
