server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ATTENZIONE alla trappola di nginx: un `add_header` dentro un
    # `location` AZZERA quelli ereditati dal blocco `server`. La prima
    # versione metteva Cache-Control nei location e le intestazioni di
    # sicurezza nel server: risultato, nessun CSP servito.
    # Qui il caching si fa con `expires`, che non rompe l'ereditarieta',
    # e gli add_header stanno tutti a livello server.
    location / {
        try_files $uri $uri/ =404;
        expires 5m;
    }
    # Gli asset hanno URL STABILI: /assets/style.css non cambia nome fra
    # un rilascio e l'altro. Con `expires 1h` un browser (o Cloudflare)
    # puo' tenersi il CSS vecchio accanto all'HTML nuovo per un'ora —
    # per esempio tema.js che cerca selettori che il CSS in cache non ha
    # ancora. Nessuna delle due parti e' sbagliata: e' la coppia a esserlo.
    #
    # `no-cache` non significa "non mettere in cache": significa
    # "rivalida sempre". Con l'ETag che nginx gia' emette, una risorsa
    # invariata costa un 304 senza corpo. Il prezzo e' un round-trip,
    # il guadagno e' che HTML e asset non possono piu' divergere.
    location /assets/ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Nessun form, nessuna API, nessuna risorsa esterna: il corso e'
    # autonomo e funziona offline. La CSP lo dichiara invece di
    # lasciarlo implicito. 'unsafe-inline' serve al solo snippet
    # anti-lampeggio del tema, che sta in <head> per necessita'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript text/html;
    gzip_min_length 1024;
}
