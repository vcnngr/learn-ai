# Intestazioni di sicurezza, in UN posto solo.
#
# Perche' un file incluso e non tre righe ripetute: in nginx un
# `add_header` dentro un `location` AZZERA quelli ereditati dal blocco
# `server`, quindi ogni location deve ridichiararli per intero. Averli
# ricopiati a mano ha prodotto lo stesso difetto quattro volte:
#
#   1. CSP assente sulle pagine       (location / con Cache-Control)
#   2. CSP assente sugli asset        (location /assets/)
#   3. Cache immutabile sui 404       (`always` di troppo)
#   4. Referrer-Policy assente sui 404 (handler @nontrovato)
#
# Le prime tre le ha trovate una review, la quarta pure. Ripetere a mano
# un elenco in piu' punti non e' una svista: e' una struttura che
# produce sviste. Adesso aggiungere o cambiare un'intestazione si fa
# qui, e vale ovunque il file sia incluso.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
