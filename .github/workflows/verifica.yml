# Il gate del corso, eseguito a ogni push.
#
# Non è "CI perché si usa": è la checklist di RILASCIO.md resa obbligatoria.
# Un controllo che si deve ricordare di lanciare è un controllo che prima o
# poi non viene lanciato.
name: verifica

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:

  # ------------------------------------------------------------------
  # AMBIENTE DI RIFERIMENTO — quello su cui il corso è stato scritto.
  # Qui il gate DEVE passare: le pagine contengono l'output prodotto da
  # questo stack, e ogni divergenza è un difetto da correggere.
  # ------------------------------------------------------------------
  riferimento:
    name: gate sull'ambiente di riferimento (torch 2.2.2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Il gate gira DENTRO il container di riferimento, non con un pip
      # install che gli somiglia. Il primo tentativo installava le stesse
      # versioni sul runner e falliva lo stesso: il runner ha 2 core, la
      # macchina di sviluppo 16, e il numero di thread cambia l'ordine
      # delle riduzioni BLAS. Se l'ambiente e' un artefatto, va USATO.
      - name: Costruisci l'ambiente di riferimento
        run: docker build -t learn-ai .

      - name: Dichiara l'ambiente
        run: docker run --rm -v "$PWD:/w" -w /w learn-ai python3 corso/labs/lab_00_1_ambiente.py

      - name: Parity — conti.js contro lab_06_1_memoria.py
        run: docker run --rm -v "$PWD:/w" -w /w learn-ai python3 corso/tools/parity_conti.py

      # I GATE SANNO FALLIRE? Prima domanda, non ultima.
      # `--copertura` faceva `return 0` incondizionato mentre questa CI lo
      # invocava chiamandolo «controllo DURO»: per due commit c'e' stato un
      # controllo che non poteva fallire. Ora si prova, invece di crederci.
      - name: I gate si accorgono di un difetto introdotto apposta
        run: docker run --rm -v "$PWD:/w" -w /w learn-ai python3 corso/tools/prova_i_gate.py

      # COPERTURA: controllo DURO. Non dipende dai numeri, solo dalla
      # marcatura, quindi vale su qualunque CPU.
      - name: Copertura della marcatura data-lab
        run: docker run --rm -v "$PWD:/w" -w /w learn-ai python3 corso/verifica.py --copertura

      # GATE NUMERICO: informativo QUI, e la ragione va detta per intero.
      #
      # Pinnare python, torch, numpy e i thread non basta: il runner e la
      # macchina che ha generato i numeri hanno CPU con set di istruzioni
      # diversi, quindi BLAS sceglie kernel vettorizzati diversi, quindi
      # gli arrotondamenti differiscono. Sui lab che ADDESTRANO la
      # differenza si amplifica su ventimila passi.
      #
      # Le due strade sbagliate erano: allargare la tolleranza finche'
      # passa (allora il gate non controlla piu' niente: 694 contro 677
      # e' il 2,5%, meno del rumore fra CPU), oppure fingere che il
      # problema non ci sia.
      #
      # Il gate DURO resta quello di RILASCIO.md, eseguito nel container
      # sulla macchina che ha generato i numeri. Qui il rapporto si legge:
      # dice quanto due CPU diverse si allontanano, ed e' un dato.
      - name: Gate numerico — informativo, la CPU non e' quella di riferimento
        continue-on-error: true
        run: docker run --rm -v "$PWD:/w" -w /w learn-ai python3 corso/verifica.py

  # ------------------------------------------------------------------
  # IL SITO — l'immagine che gira davvero sul cluster.
  #
  # Fino a questo commit la CI non la costruiva nemmeno: un
  # Dockerfile.sito rotto, o uno script di versionamento che smette di
  # marcare gli asset, si sarebbero scoperti al rilascio.
  #
  # E il controllo delle intestazioni stava solo in RILASCIO.md, cioe'
  # dipendeva dal ricordarsene — proprio la ragione per cui questa CI
  # esiste. Quattro difetti consecutivi sulle intestazioni sono usciti
  # da una review invece che da un controllo: adesso il controllo c'e',
  # ed e' DURO.
  # ------------------------------------------------------------------
  sito:
    name: immagine del sito e intestazioni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Costruire l'immagine e' gia' meta' del controllo: lo script di
      # versionamento fallisce il build se un riferimento resta senza
      # digest nel nome.
      - name: Costruisci l'immagine del sito
        run: docker build -f Dockerfile.sito -t learn-ai-sito:ci .

      # Prima il gate, poi cio' che il gate controlla. Stessa regola del
      # passo 0 di RILASCIO.md: un controllo che non si e' mai visto
      # fallire non e' un controllo. Questo inietta un difetto reale —
      # toglie Referrer-Policy — e verifica che il rapporto lo NOMINI,
      # non solo che diventi rosso.
      - name: La prova delle intestazioni sa fallire?
        run: sh deploy/prova-la-prova.sh

      - name: Ogni risposta porta le intestazioni che deve portare
        run: sh deploy/prova-intestazioni.sh learn-ai-sito:ci

      # Invarianti di impaginazione: il comando del tema deve restare
      # raggiungibile a ENTRAMBI i breakpoint. Sopra i 980px e' ancorato
      # al piede di una colonna che scorre internamente; sotto, quella
      # struttura non esiste e il piede deve passare in testa. Una
      # regressione qui e' invisibile a ogni altro controllo.
      - name: Gli invarianti di impaginazione reggono a tutti i breakpoint
        run: python3 deploy/prova-layout.py

  # ------------------------------------------------------------------
  # AMBIENTE RECENTE — quello che sulla macchina di scrittura NON si può
  # installare: su macOS x86 torch si ferma a 2.2.2.
  #
  # Qui girano per la prima volta i rami che AMBIENTI.md dichiara «mai
  # eseguiti»: F.rms_norm nativo e scaled_dot_product_attention(enable_gqa=).
  #
  # continue-on-error: il gate PUÒ fallire, ed è informativo quando succede.
  # Le pagine contengono l'output dell'ambiente di riferimento; se uno stack
  # più recente produce numeri diversi, quello è un DATO — non un difetto da
  # nascondere facendo passare il job.
  # ------------------------------------------------------------------
  recente:
    name: rami mai eseguiti (torch recente) — informativo
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installa lo stack recente
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy safetensors

      - name: Quali rami si attivano qui
        run: python3 corso/labs/lab_00_1_ambiente.py

      - name: Parity — deve valere in ogni ambiente
        run: python3 corso/tools/parity_conti.py

      - name: Gate — le divergenze qui sono un dato, non un difetto
        run: python3 corso/verifica.py
